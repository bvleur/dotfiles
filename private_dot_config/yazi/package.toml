# yazi plugins, installed by .chezmoiscripts/run_onchange_after_darwin-yazi-plugins.sh (`ya pkg install`).
# Add one with `ya pkg add <owner>/<repo>` and copy the resulting entry (with its pinned rev/hash) here.

[[plugin.deps]]
use = "bgreenwell/doxx"

[[plugin.deps]]
use = "Lil-Dank/lazygit"

# Runs a shell pipeline as previewer; used for markdown via glow (the standalone glow.yazi is deprecated in favour of piper)
[[plugin.deps]]
use = "yazi-rs/plugins:piper"
