<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFA"/>
      <stop offset="1" stop-color="#2B2F8F"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9DCE8"/>
    </linearGradient>
    <clipPath id="screen"><rect x="112" y="134" width="288" height="184" rx="12"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- lid -->
  <rect x="96" y="118" width="320" height="216" rx="26" fill="url(#lid)"/>
  <!-- base -->
  <rect x="64" y="346" width="384" height="28" rx="14" fill="url(#lid)"/>
  <rect x="220" y="346" width="72" height="9" rx="4.5" fill="#B9BDD1"/>
  <!-- screen: light left, dark right -->
  <g clip-path="url(#screen)">
    <rect x="112" y="134" width="144" height="184" fill="#F6F7FB"/>
    <rect x="256" y="134" width="144" height="184" fill="#14151F"/>
  </g>
  <!-- indicator: inverted split disc -->
  <path d="M256 174 A52 52 0 0 0 256 278 Z" fill="#14151F"/>
  <path d="M256 174 A52 52 0 0 1 256 278 Z" fill="#F6F7FB"/>
</svg>
